<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<title>کتابخانه من</title>
<meta name="theme-color" content="#f1efe9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#ffffffcc;--ink:#1c1b22;--mut:#6d6a78;--line:#0000001a;--acc:#6d4aff;--acc2:#ff5c8a;--sh:0 10px 40px #2b1d6a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d16;--card:#1a1826cc;--ink:#f2f0fa;--mut:#9b97ad;--line:#ffffff1c;--sh:0 10px 40px #0008}}
:root[data-theme="dark"]{--bg:#0e0d16;--card:#1a1826cc;--ink:#f2f0fa;--mut:#9b97ad;--line:#ffffff1c;--sh:0 10px 40px #0008}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--acc);top:-15vmax;right:-10vmax}
.bg i:nth-child(2){background:var(--acc2);bottom:-18vmax;left:-12vmax;animation-delay:-6s}
.bg i:nth-child(3){background:#27d3c3;top:30%;left:35%;width:28vmax;height:28vmax;opacity:.22;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,5vmax) scale(1.18) rotate(40deg)}}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 90px}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:end;justify-content:space-between;animation:up .8s cubic-bezier(.2,.9,.2,1) both}
h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:800;background:linear-gradient(100deg,var(--acc),var(--acc2),var(--acc));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.sub{color:var(--mut);margin:6px 0 0;font-weight:300}

.st b{display:block;font-size:26px;font-weight:800}.st span{color:var(--mut);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 12px;animation:up .8s .35s both}

input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;outline:none;transition:.25s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px #6d4aff2b}
.btn{font:inherit;border:0;cursor:pointer;border-radius:14px;padding:12px 20px;color:#fff;font-weight:600;background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 8px 24px #6d4aff55;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;animation:up .8s .45s both}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;transition:.25s}
.chip:hover{transform:translateY(-2px)}.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px;perspective:1100px}
.card{position:relative;display:flex;gap:14px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);transform-style:preserve-3d;transition:transform .25s ease-out,box-shadow .3s;animation:pop .7s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i)*55ms)}
.card:hover{box-shadow:0 22px 50px #6d4aff33}
.cv{flex:0 0 86px;height:126px;border-radius:6px 12px 12px 6px;padding:10px 8px;color:#fff;font-weight:800;font-size:13px;line-height:1.5;display:flex;align-items:flex-end;box-shadow:-6px 8px 18px #0004,inset 5px 0 0 #0003;transform:translateZ(30px) rotateY(-8deg);overflow:hidden;position:relative}
.cv:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#ffffff55 50%,#fff0 70%);transform:translateX(-120%);transition:transform .9s}
.card:hover .cv:after{transform:translateX(120%)}
.inf{min-width:0;flex:1;transform:translateZ(18px)}
.inf h3{margin:2px 0 6px;font-size:16.5px;font-weight:800;overflow-wrap:anywhere}
.inf p{margin:2px 0;font-size:12.8px;color:var(--mut);overflow-wrap:anywhere}.inf p b{color:var(--ink);font-weight:600}
.tag{display:inline-block;margin-top:6px;font-size:11.5px;padding:3px 10px;border-radius:99px;color:#fff}
.loc{margin-top:8px;font-size:12.5px;border:1px dashed var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;background:none;color:var(--mut);font-family:inherit;width:100%;text-align:right;transition:.2s}
.loc:hover{border-color:var(--acc);color:var(--acc)}.loc.ok{border-style:solid;color:var(--ink)}
.acts{position:absolute;top:8px;left:8px;display:flex;gap:4px;opacity:.9;transition:.2s;transform:translateZ(40px);z-index:3}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.acts button{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;box-shadow:0 2px 8px #0002}
.empty{text-align:center;padding:70px 10px;color:var(--mut);animation:up .8s both}.empty .em{font-size:64px}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.md{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0009;backdrop-filter:blur(8px);padding:16px}
.md.on{display:flex;animation:fi .3s both}
.box{width:min(480px,100%);background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 30px 80px #0007;animation:pop .5s cubic-bezier(.2,1.3,.3,1) both}
.pg{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:20px}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s cubic-bezier(.2,1,.3,1)}
.q{animation:up .45s both}.q small{color:var(--mut)}.q h2{margin:4px 0 14px;font-size:22px}.q input{width:100%;font-size:16px}
.q .chips{margin:12px 0 0;animation:none}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:20px}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;z-index:30;animation:up .4s both}
.iw{position:relative}.iw input{padding-left:54px}
.mic{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:18px;background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;transition:.2s}
.mic.on{animation:pl 1s infinite}.bar .iw{flex:1;min-width:200px}.bar .iw input{width:100%}
@keyframes pl{0%{box-shadow:0 0 0 0 #ff5c8aaa}100%{box-shadow:0 0 0 16px #ff5c8a00}}
.gv{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;z-index:15;font-size:15px;padding:14px 22px;border-radius:99px}
.gv.on{animation:pl 1.2s infinite}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cv[data-a],.inf h3[data-a]{cursor:pointer}
.lend{color:var(--ink)!important}.lend.od{color:#ff3b5c!important;font-weight:600}
.al{display:none;background:#ff3b5c1f;border:1px solid #ff3b5c66;color:var(--ink);border-radius:16px;padding:12px 16px;margin-bottom:16px;animation:up .6s both}.al.on{display:block}
.dt{display:grid;gap:10px}.dt label{font-size:13px;color:var(--mut)}.dt input{width:100%}
.pv{height:170px;border-radius:14px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut)}.pv img{width:100%;height:100%;object-fit:cover}
.grid{perspective:none}.st{backdrop-filter:none;transition:transform .3s,box-shadow .3s}.st:hover{transform:translateY(-4px)}
.st:before{float:left;font-size:26px}.st:nth-child(1):before{content:"📚"}.st:nth-child(2):before{content:"✍️"}.st:nth-child(3):before{content:"🏷"}.st:nth-child(4):before{content:"📍"}
.st b{background:linear-gradient(120deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{backdrop-filter:none;display:block;padding:0;transform-style:flat;perspective:900px;opacity:0;animation:none;transition:box-shadow .3s,border-color .3s}
.card.v{animation:pop .7s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i)*40ms)}.card.s{animation:none!important;opacity:1}
.card:hover{border-color:var(--acc)}
.ci{display:flex;gap:14px;padding:14px;transform-style:preserve-3d;transition:transform .2s ease-out}
.card:after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),#6d4aff26,transparent 65%);opacity:0;transition:opacity .3s}.card:hover:after{opacity:1}
.bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#8885 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
header{position:relative;padding-top:30px}.fb{position:absolute;top:-6px;font-size:22px;opacity:.4;pointer-events:none;animation:none}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff5 50%,transparent 70%);transform:translateX(120%);transition:transform .6s}.btn:hover:after{transform:translateX(-120%)}
#sp{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:40}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;outline:none}select:focus{border-color:var(--acc)}
.md{padding:max(16px,env(safe-area-inset-top,0px)) 14px max(16px,env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.box{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media(max-height:760px){.pv{height:120px}.box{padding:18px}.q h2{font-size:19px}}
.bg{background:var(--bg)}.bg i,.bg:after{display:none}
:root{--bg:#f1efe9;--card:#ffffff;--sh:0 4px 16px #2b1d6a14}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--card:#201f2b;--sh:0 4px 16px #0004}}
:root[data-theme="dark"]{--bg:#15141c;--card:#201f2b;--sh:0 4px 16px #0004}
*{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.md{background:#000a}
.inf p.ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);opacity:.85;margin-top:8px;line-height:1.8}
@keyframes sheet{from{transform:translateY(100%)}}
@media(max-width:480px){
 input,textarea,select{font-size:16px}
 .wrap{padding:16px 14px calc(120px + env(safe-area-inset-bottom,0px))}
 h1{font-size:30px}.sub{font-size:13px}.fb{display:none}
 header>div:last-of-type{display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
 header>div:last-of-type::-webkit-scrollbar{display:none}
 .btn{white-space:nowrap;min-height:46px;flex:0 0 auto}
 #add{position:fixed;left:14px;right:78px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:99px;font-size:17px;box-shadow:0 10px 28px #6d4aff66;flex:none}
 .gv{font-size:0;width:54px;height:54px;padding:0;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}.gv:before{content:"🎙";font-size:24px}
 .stats{gap:8px;margin-top:14px}.st{padding:12px 14px;border-radius:16px}.st b{font-size:22px}
 .bar{margin:16px 0 10px}.bar .iw{min-width:0}
 .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-14px;padding:2px 14px 4px;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-height:40px;padding:8px 16px}
 .q .chips{flex-wrap:wrap;overflow:visible;margin-inline:0;padding:0}
 .grid{grid-template-columns:1fr;gap:14px}
 .acts button{width:40px;height:40px}
 .loc{min-height:44px}
 .md{padding:0;align-items:flex-end}
 .box{width:100%;border-radius:26px 26px 0 0;max-height:92vh;max-height:92dvh;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sheet .4s cubic-bezier(.2,.9,.2,1) both}
 .row{gap:8px}.row .btn{flex:1}.row>div{flex:1;display:flex;gap:8px}
 .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:90vw;text-align:center}
}
#fab{display:none}
@media(max-width:480px){
 header>div:last-of-type{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;overflow:visible!important;width:100%}
 header>div:last-of-type .btn{width:100%;min-height:44px;padding:10px 8px;font-size:14px;white-space:nowrap}
 #add{display:none!important}
 #fab{display:block;position:fixed;left:14px;right:80px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:99px;font-size:17px;min-height:54px;box-shadow:0 10px 28px #6d4aff66}
 .card{perspective:none!important}
 .ci{flex-wrap:wrap;transform:none!important;transform-style:flat!important;gap:12px;padding:14px}
 .cv{flex:0 0 78px;height:112px;transform:none!important;box-shadow:0 4px 12px #0003,inset 4px 0 0 #0003}
 .inf{flex:1 1 0;min-width:0;transform:none!important}
 .acts{position:static!important;opacity:1;transform:none!important;order:3;flex:0 0 100%;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px}
 .acts button{flex:1;width:auto;height:42px;font-size:14px}
 .acts [data-a=e]:after{content:" ویرایش"}.acts [data-a=d]:after{content:" حذف"}
}
@media(max-width:480px){
 .st:before{display:none}.st{padding:10px 14px}.st b{font-size:20px}
 header>div:last-of-type .btn{min-height:40px;padding:8px 6px;font-size:13px}
 h1{font-size:28px}
}
@media(max-width:480px){.cv{align-items:flex-start;font-size:12px;overflow-wrap:anywhere}}
#mail{font-weight:600}
:root{--bg:#f5f7fd;--card:#ffffffee;--line:#1b1f3a14;--sh:0 6px 22px #3b4a8c14}
.bg{background:linear-gradient(180deg,#fafbff,#edf2fc 70%,#e9effb)}
.bg:before{content:"کتاب، دریچه‌ای به جهان";position:absolute;left:5%;width:90%;top:16%;text-align:center;font-family:"Noto Nastaliq Urdu",serif;font-size:min(15vw,112px);line-height:2.2;color:#4a3fd0;opacity:.07;pointer-events:none}
.bg:after{display:block!important;content:"";position:absolute;inset:0;background:url(calligraphy.png) center/contain no-repeat;opacity:.12;pointer-events:none}

@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.88) rotateX(12deg)}}
@keyframes fi{from{opacity:0}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="sp"></div><div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
<header><span class="fb" style="--d:0s;left:42%">📕</span><span class="fb" style="--d:-2s;left:55%">📗</span><span class="fb" style="--d:-4s;left:68%">📘</span><div><h1>📚 کتابخانه من</h1><p class="sub">فهرست کتاب‌ها، نویسنده‌ها و جای هر کتاب در قفسه</p></div>
<div style="display:flex;gap:8px"><button class="btn g" id="bk">💾 پشتیبان</button><button class="btn g" id="im">⬆ ورود فایل</button><input type="file" id="imf" accept=".json,.csv,text/csv,application/json" hidden><button class="btn g" id="shr">🔗 لینک اشتراک</button><button class="btn g" id="exp">⬇ خروجی CSV</button><button class="btn g" id="mail">✉ ارسال پشتیبان به ایمیل</button><button class="btn" id="add">＋ افزودن کتاب</button></div></header>
<div class="stats" id="stats"></div>
<div class="bar"><div class="iw"><input id="s" placeholder="🔍 جستجو (تایپی یا صوتی 🎤)…"><button class="mic" id="smic" type="button" title="جستجوی صوتی">🎤</button></div></div>
<div class="chips" id="chips"></div>
<div class="al" id="al"></div>
<div class="grid" id="grid"></div>
</div>
<button class="btn" id="fab">＋ افزودن کتاب</button>
<button class="btn gv" id="gv">🎙 فرمان صوتی کل سایت</button>
<div class="md" id="md"><div class="box" id="box"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa=n=>Number(n).toLocaleString("fa-IR");
const F=[
{k:"title",q:"نام کتاب چیست؟",ph:"مثلاً: بوف کور",req:1},
{k:"author",q:"نام نویسنده کیست؟",ph:"مثلاً: صادق هدایت",req:1},
{k:"translator",q:"نام مترجم؟",ph:"اگر مترجم ندارد، رد کنید",opt:1},
{k:"publisher",q:"نام انتشارات؟",ph:"مثلاً: نشر چشمه"},
{k:"genre",q:"ژانر کتاب؟",ph:"انتخاب کنید یا بنویسید",chips:["رمان","شعر","تاریخ","فلسفه","روانشناسی","علمی","حسابداری و اقتصاد","کودک","مذهبی","دیگر"],req:1},
{k:"place",q:"جای کتاب در کتابخانه؟",ph:"مثلاً: قفسه ۲ – ردیف ۳ (می‌توانید بعداً ثبت کنید)",opt:1}];
let books=[],q="",gf="all",cur=null,col=null;
const hue=s=>{let h=0;for(const c of String(s||"؟"))h=(h*31+c.charCodeAt(0))%360;return h};
const LS="lib_books_v1";
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
function count(el,to){const t0=performance.now(),from=+el.dataset.v||0;el.dataset.v=to;(function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=fa(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(f)})(t0)}
function render(){
 const g=[...new Set(books.map(b=>b.genre).filter(Boolean))];
 const st=[["کل کتاب‌ها",books.length],["نویسنده",new Set(books.map(b=>b.author).filter(Boolean)).size],["ژانر",g.length],["بدون جای ثبت‌شده",books.filter(b=>!b.place).length]];
 if(!$("stats").children.length)$("stats").innerHTML=st.map((x,i)=>`<div class="st" style="--i:${i}"><b data-v="0">۰</b><span>${x[0]}</span></div>`).join("");
 [...$("stats").querySelectorAll("b")].forEach((b,i)=>count(b,st[i][1]));
 $("chips").innerHTML=["all",...g].map(x=>`<button class="chip ${gf===x?"on":""}" data-g="${esc(x)}">${x==="all"?"همه":esc(x)}</button>`).join("");
 const k=q.trim().toLowerCase();
 const L=books.filter(b=>(gf==="all"||b.genre===gf)&&(!k||[b.title,b.author,b.translator,b.publisher,b.genre,b.place].join(" ").toLowerCase().includes(k)));

function pic(f){return new Promise(r=>{const fr=new FileReader();fr.onerror=()=>r(null);fr.onload=()=>{const i=new Image();i.onerror=()=>r(null);i.onload=()=>{try{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.78))}catch(e){r(null)}};i.src=fr.result};fr.readAsDataURL(f)})}

async function saveFile(name,data,type){try{const d=window.claude&&await claude.use("downloads");if(!d)throw 0;await d.save({filename:name,data})}catch(e){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}}

function parseCSV(t){t=t.replace(/^\ufeff/,"");const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}if(c||r.length){r.push(c);R.push(r)}return R}
async function importRows(rows){if(ro)return toast("نسخه اشتراکی فقط‌خواندنی است");
 const key=b=>((b.title||"")+"|"+(b.author||"")).trim(),have=new Set(books.map(key));let add=0,skip=0;quiet=true;
 for(const b of rows){if(!b.title||have.has(key(b))){skip++;continue}have.add(key(b));await save(null,b);add++}
 quiet=false;toast(`✔ ${fa(add)} کتاب اضافه شد، ${fa(skip)} تکراری نادیده گرفته شد؛ چیزی پاک نشد`)}
$("imf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const t=await f.text();let rows=[];
 try{if(/\.json$/i.test(f.name)||t.trim()[0]==="{"||t.trim()[0]==="["){const j=JSON.parse(t);rows=(Array.isArray(j)?j:j.books||[])}
 else{const R=parseCSV(t),H={"نام کتاب":"title","نویسنده":"author","مترجم":"translator","انتشارات":"publisher","ژانر":"genre","جای کتاب":"place"},hd=(R[0]||[]).map(h=>H[h.trim()]);
  rows=R.slice(1).filter(r=>r.some(x=>x.trim())).map(r=>{const o={};hd.forEach((k,i)=>{if(k)o[k]=(r[i]||"").trim()});return o})}}
 catch(err){return toast("فایل قابل خواندن نیست")}
 await importRows(rows.map(({id,...r})=>r))};
function mirror(){if(books.length){try{localStorage.setItem(LSB,JSON.stringify(books))}catch(e){try{localStorage.setItem(LSB,JSON.stringify(books.map(({photo,...r})=>r)))}catch(e2){}}return}
 setTimeout(()=>{if(books.length||document.getElementById("rb"))return;let m=[];try{m=JSON.parse(localStorage.getItem(LSB)||"[]")}catch(e){}if(!m.length)return;
  const bn=document.createElement("div");bn.id="rb";bn.className="al on";bn.innerHTML=`💾 یک نسخه پشتیبان با ${fa(m.length)} کتاب روی این دستگاه پیدا شد. <button class="btn" id="rbb" style="margin-right:10px;padding:8px 16px">بازیابی</button>`;
  $("al").after(bn);$("rbb").onclick=async()=>{bn.remove();await importRows(m.map(({id,...r})=>r))}},2500)}
const MAIL={service:"",template:"",key:""}; // تنظیمات EmailJS (برای ارسال خودکار) — راهنما در پاسخ
const LSE="lib_email",LSS="lib_last_sent";let gate=false;
const okMail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const getMail=()=>{try{return localStorage.getItem(LSE)||""}catch(e){return ""}};
function gateBox(){gate=true;$("box").innerHTML=`<h2 style="margin-top:0">📚 به کتابخانه من خوش آمدید</h2><p style="color:var(--mut);line-height:1.9;font-size:14px">ایمیل خود را وارد کنید تا نسخه پشتیبان کتاب‌هایتان به همین ایمیل ارسال شود. ایمیل روی همین دستگاه ذخیره می‌شود و فقط برای ارسال پشتیبان استفاده می‌شود.</p><input id="em" type="email" inputmode="email" autocomplete="email" dir="ltr" style="width:100%" placeholder="you@example.com"><div class="row"><button class="btn" id="emg" style="width:100%">ادامه</button></div>`;$("md").classList.add("on");
 const go=()=>{const v=$("em").value.trim();if(!okMail(v)){$("em").classList.add("shake");setTimeout(()=>$("em").classList.remove("shake"),400);return}try{localStorage.setItem(LSE,v)}catch(e){}gate=false;closeWiz();toast("✔ ایمیل ذخیره شد")};$("emg").onclick=go;$("em").onkeydown=e=>{if(e.key==="Enter")go()}}
function mailSheet(){$("box").innerHTML=`<h2 style="margin-top:0">✉ ارسال پشتیبان</h2><label style="font-size:13px;color:var(--mut)">ایمیل گیرنده</label><input id="em" type="email" inputmode="email" dir="ltr" style="width:100%;margin-top:6px" value="${esc(getMail())}"><div class="row" style="flex-wrap:wrap"><button class="btn g" id="px">انصراف</button><button class="btn g" id="pr">بازیابی از متن ایمیل</button><button class="btn" id="ps">ذخیره و ارسال</button></div>`;$("md").classList.add("on");
 $("px").onclick=closeWiz;$("ps").onclick=()=>{const v=$("em").value.trim();if(!okMail(v))return toast("ایمیل معتبر نیست");try{localStorage.setItem(LSE,v)}catch(e){}closeWiz();sendBackup()};$("pr").onclick=pasteSheet}
function pasteSheet(){$("box").innerHTML=`<h2 style="margin-top:0">⬆ بازیابی از ایمیل</h2><p style="font-size:13.5px;color:var(--mut);line-height:1.8">بخش «داده برای بازیابی» را از ایمیل کپی کنید و اینجا بچسبانید. کتاب‌های موجود پاک نمی‌شوند.</p><textarea id="pt" rows="6" dir="ltr" style="width:100%"></textarea><div class="row"><button class="btn g" id="px">انصراف</button><button class="btn" id="pg">بازیابی</button></div>`;
 $("px").onclick=closeWiz;$("pg").onclick=async()=>{const m=$("pt").value.match(/\{[\s\S]*\}/);if(!m)return toast("متن معتبر نیست");try{const j=JSON.parse(m[0]);closeWiz();await importRows((j.books||[]).map(({id,...r})=>r))}catch(e){toast("متن معتبر نیست")}}}
async function sendBackup(silent){
 const to=getMail();if(!okMail(to)){if(!silent)mailSheet();return}
 if(!books.length){if(!silent)toast("هنوز کتابی ثبت نشده");return}
 const rows=books.map(({id,photo,...r})=>r),date=new Date().toISOString().slice(0,10);
 const lines=rows.map((b,i)=>`${i+1}. ${b.title||""} | ${b.author||""} | ${b.translator||""} | ${b.publisher||""} | ${b.genre||""} | ${b.place||""}`).join("\n");
 const json=JSON.stringify({v:1,books:rows});
 const text=`کتابخانه من — ${date}\nتعداد کتاب‌ها: ${rows.length}\n\n${lines}\n\n--- داده برای بازیابی ---\n${json}`;
 if(MAIL.service&&MAIL.template&&MAIL.key){
  try{const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:MAIL.service,template_id:MAIL.template,user_id:MAIL.key,template_params:{to_email:to,subject:"پشتیبان کتابخانه من — "+date,message:'<pre style="white-space:pre-wrap;font-family:inherit">'+esc(text)+"</pre>"}})});
   if(!r.ok)throw 0;try{localStorage.setItem(LSS,String(Date.now()))}catch(e){}toast("✔ پشتیبان به "+to+" ارسال شد");return}catch(e){if(silent)return;toast("ارسال خودکار ناموفق بود؛ روش دستی استفاده می‌شود")}
 }
 if(silent)return;
 const fn=`library-backup-${date}.json`;
 try{const file=new File([json],fn,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"پشتیبان کتابخانه من",text:"پشتیبان کتابخانه من — "+date});try{localStorage.setItem(LSS,String(Date.now()))}catch(e){}return}}catch(e){if(e&&e.name==="AbortError")return}
 await saveFile(fn,json,"application/json");
 location.href="mailto:"+to+"?subject="+encodeURIComponent("پشتیبان کتابخانه من — "+date)+"&body="+encodeURIComponent(rows.length+" کتاب\nفایل پشتیبان دانلود شد؛ آن را به این ایمیل پیوست کنید.")}
$("mail").onclick=()=>sendBackup();
let advT=null;
function normFa(t){return String(t||"").replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u064B-\u065F\u0670]/g,"").replace(/[.،؟!,؛]/g,"").replace(/\s+/g," ").trim()}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function snap(k,t){const pool=new Set((F.find(f=>f.k===k)||{}).chips||[]);books.forEach(b=>b[k]&&pool.add(b[k]));let best=t,sc=0;pool.forEach(v=>{const n=normFa(v),m=Math.max(n.length,t.length);if(!m)return;const r=1-lev(n,t)/m;if(r>sc){sc=r;best=v}});return sc>=.8?best:t}
